name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      company_slug:
        description: "Slug da empresa (ex.: ar-clima-by79u)"
        required: true
        type: string
      company_name:
        description: "Nome exibido no aplicativo"
        required: true
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set company configuration
        id: company
        shell: bash
        env:
          INPUT_SLUG: ${{ inputs.company_slug }}
          INPUT_NAME: ${{ inputs.company_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SLUG="${INPUT_SLUG:-demo}"
          NAME="${INPUT_NAME:-Avaliação Google}"
          SLUG="$(echo "$SLUG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-40)"
          if [ -z "$SLUG" ]; then echo "Slug inválido"; exit 1; fi
          # Keep the original hyphenated slug for URLs, release tags and APK names.
          # Android applicationId segments may contain only letters and digits.
          PACKAGE_SLUG="$(printf '%s' "$SLUG" | tr -cd 'a-z0-9' | cut -c1-50)"
          if [ -z "$PACKAGE_SLUG" ]; then PACKAGE_SLUG="demo"; fi
          case "$PACKAGE_SLUG" in
            [a-z]*) ;;
            *) PACKAGE_SLUG="c$PACKAGE_SLUG" ;;
          esac
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "package_slug=$PACKAGE_SLUG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=avaliacao-google-$SLUG.apk" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build company APK
        run: |
          gradle -p android-app assembleDebug \
            -PcompanySlug="${{ steps.company.outputs.slug }}" \
            -PcompanyPackageSlug="${{ steps.company.outputs.package_slug }}" \
            -PcompanyName="${{ steps.company.outputs.name }}" \
            --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk "${{ steps.company.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.company.outputs.apk_name }}
          path: ${{ steps.company.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish company APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ steps.company.outputs.slug }}
          name: App - ${{ steps.company.outputs.name }}
          files: ${{ steps.company.outputs.apk_name }}
          overwrite_files: true
          make_latest: false
